<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(135deg, #ffc0cb, #ffe4e1);
    text-align: center;
    overflow-x: hidden;
}

.container {
    padding: 30px;
}

h1 {
    color: #ff4d88;
    font-size: 2.5em;
}

p {
    font-size: 1.2em;
    color: #444;
}

img {
    width: 200px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.button {
    margin-top: 20px;
    padding: 12px 25px;
    background: #ff4d88;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 1em;
    transition: 0.3s;
}

.button:hover {
    background: #ff1a66;
}

/* hati animasi */
.heart {
    position: fixed;
    color: pink;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Hai Kamu 💖</h1>

    <!-- GANTI FOTO DI SINI -->
    <img src="foto-crush.jpg" alt="Crush Aku">

    <p>
        Aku mau jujur sesuatu...<br><br>
        Dari sekian banyak hal yang aku temui,<br>
        kamu adalah yang paling bikin aku senyum sendiri 😊<br><br>

        I think I like you more than just a friend... 💕
    </p>

    <button class="button" onclick="confess()">Klik ini ya 😳</button>

    <p id="hiddenMessage" style="display:none; margin-top:20px;">
        Aku suka kamu... mau nggak kita jadi lebih dekat? 💖
    </p>
</div>

<script>
function confess() {
    document.getElementById("hiddenMessage").style.display = "block";
}

/* efek hati jatuh */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
